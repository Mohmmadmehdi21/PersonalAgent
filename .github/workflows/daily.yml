name: Daily clips
on:
  schedule:
    - cron: "30 18 * * *"   # 00:00 IST
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: personalagent-${{ github.ref }}
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13.7" }
      - name: Restore pipeline queue and media cache
        uses: actions/cache/restore@v4
        with:
          path: |
            state.json
            review/queue.json
            work/
            data/used_videos.json
            data/rejected_ids.json
          key: personalagent-runtime-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            personalagent-runtime-${{ github.ref_name }}-
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements.txt
      - name: OAuth files securely write karo
        env:
          CLIENT_SECRET_JSON: ${{ secrets.CLIENT_SECRET_JSON }}
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          for env_name, file_name in (("CLIENT_SECRET_JSON", "client_secret.json"), ("TOKEN_JSON", "token.json")):
              value = os.environ.get(env_name, "")
              if not value:
                  raise SystemExit(f"Required GitHub Actions secret {env_name} is missing.")
              Path(file_name).write_text(value, encoding="utf-8")
          PY
      - name: Prepare drafts only (publishing disabled)
        run: python main.py prepare
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DRY_RUN: "true"
          OWN_CONTENT_ENABLED: "false"
      - name: Save pipeline queue and media cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state.json
            review/queue.json
            work/
            data/used_videos.json
            data/rejected_ids.json
          key: personalagent-runtime-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: state.json commit
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add state.json && git commit -m "update state" || true
          git push
